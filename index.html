<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary meta -->
    <title>Holidaze &mdash; Find Your Perfect Stay</title>
    <meta
      name="description"
      content="Discover and book unique venues worldwide &mdash; from cosy cottages to luxury villas. Create an account to list your own property."
    />
    <meta name="theme-color" content="#faf9f7" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#111110" media="(prefers-color-scheme: dark)" />

    <!-- Apply the stored theme before first paint. Without this the .dark class
         only lands after Zustand rehydrates (post-hydration), so dark-mode
         users get a full-screen white flash on every load. -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem("holidaze_theme");
          var isDark = stored
            ? JSON.parse(stored).state.isDark
            : window.matchMedia("(prefers-color-scheme: dark)").matches;
          if (isDark) document.documentElement.classList.add("dark");
        } catch (e) {
          if (window.matchMedia("(prefers-color-scheme: dark)").matches)
            document.documentElement.classList.add("dark");
        }
      })();
    </script>

    <!-- Canonical -->
    <link rel="canonical" href="https://holidazebooking.vercel.app/" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta
      property="og:title"
      content="Holidaze &mdash; Find Your Perfect Stay"
    />
    <meta
      property="og:description"
      content="Discover and book unique venues worldwide &mdash; from cosy cottages to luxury villas."
    />
    <meta property="og:image" content="https://images.unsplash.com/photo-1571896349842-33c89424de2d?w=1200&auto=format&fit=crop" />
    <meta property="og:site_name" content="Holidaze" />

    <!-- Twitter / X card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:title"
      content="Holidaze &mdash; Find Your Perfect Stay"
    />
    <meta
      name="twitter:description"
      content="Discover and book unique venues worldwide &mdash; from cosy cottages to luxury villas."
    />
    <meta name="twitter:image" content="https://images.unsplash.com/photo-1571896349842-33c89424de2d?w=1200&auto=format&fit=crop" />
    <!-- Structured data -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "Holidaze",
        "url": "https://holidazebooking.vercel.app/",
        "description": "Discover and book unique venues worldwide — from cosy cottages to luxury villas. Create an account to list your own property.",
        "potentialAction": {
          "@type": "SearchAction",
          "target": "https://holidazebooking.vercel.app/venues?q={search_term_string}",
          "query-input": "required name=search_term_string"
        }
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
